<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Administration Panel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 30, 55, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --accent-glow: rgba(139, 92, 246, 0.45);
            --success-color: #10b981;
            --error-color: #ef4444;
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 10% 20%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header Style */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #f43f5e, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.45);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .network-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .status-dot.prep {
            background-color: #eab308;
            box-shadow: 0 0 10px #eab308;
        }

        /* Grid */
        .admin-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Glassmorphic card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.75rem;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: white;
            font-family: var(--font-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        input[type="text"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            transition: all 0.25s ease;
        }

        .btn:hover {
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--success-color), #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .btn-start:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
        }

        .btn-stop {
            background: linear-gradient(135deg, var(--error-color), #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.25);
        }

        .btn-stop:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            box-shadow: none;
            transition: all 0.2s;
        }

        .btn-reset:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .feedback {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
        }

        .feedback.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success-color);
            color: #34d399;
            display: block;
        }

        .feedback.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error-color);
            color: #f87171;
            display: block;
        }

        /* Candidate list */
        .candidate-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1rem;
            max-height: 350px;
            overflow-y: auto;
        }

        .candidate-tag {
            border: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .candidate-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--accent-secondary);
            border: 1.5px solid var(--card-border);
            flex-shrink: 0;
        }

        .empty-state {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--card-border);
            border-radius: 12px;
        }

        .status-banner {
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.95rem;
        }

        .status-banner.prep {
            background: rgba(234, 179, 8, 0.1);
            border: 1px solid #eab308;
            color: #facc15;
        }

        .status-banner.live {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            color: #34d399;
        }

        .status-banner.ended {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: #f87171;
        }

        .portal-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--accent-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .portal-link:hover {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <div class="logo-icon">A</div>
                <div>
                    <h1>Election Admin Control Panel</h1>
                    <p style="font-size: 0.75rem; color: var(--text-secondary);">Register ballot candidates and manage
                        voting period</p>
                </div>
            </div>
            <div class="network-status">
                <div class="status-dot" id="header-status-dot"></div>
                <span id="header-status-text">LEDGER STATE: CONNECTED</span>
            </div>
        </header>

        <!-- Admin Workspace -->
        <div class="admin-grid">
            <!-- Left: Controls & Registrations -->
            <div class="card" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div>
                    <h2>⚙️ Control Panel</h2>
                    <div id="status-banner" class="status-banner" style="margin-top: 0.5rem; margin-bottom: 0;">Checking
                        election status...</div>
                </div>

                <!-- Candidate Registration -->
                <div class="form-group" id="reg-fields-group"
                    style="border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 1.5rem; margin-bottom: 0;">
                    <form id="register-form" onsubmit="submitRegister(event)">
                        <label for="new-party-name">Register New Candidate</label>
                        <div class="input-wrapper" style="margin-bottom: 1rem;">
                            <span class="input-icon">👤</span>
                            <input type="text" id="new-party-name" placeholder="e.g. Progressive Party" required
                                autocomplete="off">
                        </div>
                        <button type="submit" id="btn-add-candidate" class="btn">Add Candidate</button>
                    </form>
                    <div id="register-feedback" class="feedback"></div>
                </div>

                <!-- Poll Lifecycle Activation -->
                <div>
                    <label>Poll Master Activation</label>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 1rem;">Once polls are
                        open, candidate registration profiles are permanent and locked.</p>
                    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                        <button id="btn-start-polls" onclick="startVoting()" class="btn btn-start">Start Voting / Open
                            Polls</button>
                        <button id="btn-stop-polls" onclick="stopVoting()" class="btn btn-stop"
                            style="display: none;">Stop Voting / Close Polls</button>
                        <button id="btn-reset-polls" onclick="resetElection()" class="btn btn-reset">Reset
                            Election</button>
                    </div>
                </div>

                <a href="/" class="portal-link">← Go to Public Voting Portal</a>
            </div>

            <!-- Right: Registered Candidates -->
            <div style="display: flex; flex-direction: column; gap: 2rem;">
                <div class="card">
                    <h2>👥 Registered Candidates</h2>
                    <div class="candidate-list" id="candidates-roster">
                        <!-- Dynamic List -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let electionState = "PREPARATION";

        window.addEventListener('DOMContentLoaded', () => {
            refreshAdminState();
            // Polling status
            setInterval(refreshAdminState, 4000);
        });

        async function refreshAdminState() {
            try {
                const statusRes = await fetch('/status');
                const statusData = await statusRes.json();
                electionState = statusData.election_state;

                const partiesRes = await fetch('/parties');
                const parties = await partiesRes.json();

                updateUIState(electionState, parties);
            } catch (err) {
                console.error("Failed to query admin state:", err);
            }
        }

        function updateUIState(state, parties) {
            const banner = document.getElementById('status-banner');
            const dot = document.getElementById('header-status-dot');
            const statusText = document.getElementById('header-status-text');

            // Inputs
            const inputField = document.getElementById('new-party-name');
            const addBtn = document.getElementById('btn-add-candidate');

            // Lifecycle Buttons
            const startBtn = document.getElementById('btn-start-polls');
            const stopBtn = document.getElementById('btn-stop-polls');
            const resetBtn = document.getElementById('btn-reset-polls');

            const isLocked = (state === "LIVE" || state === "ENDED");

            if (inputField) inputField.disabled = isLocked;
            if (addBtn) addBtn.disabled = isLocked;

            if (state === "LIVE") {
                banner.className = "status-banner live";
                banner.innerText = "🔒 ELECTION STATUS: LIVE (Voting Period is Active)";
                dot.className = "status-dot";
                dot.style.backgroundColor = "";
                dot.style.boxShadow = "";
                statusText.innerText = "LEDGER STATE: LIVE";

                if (inputField) inputField.placeholder = "Registers locked — Polls are open";

                startBtn.style.display = "none";
                stopBtn.style.display = "block";
                stopBtn.disabled = false;
                stopBtn.innerText = "Stop Voting / Close Polls";
            } else if (state === "ENDED") {
                banner.className = "status-banner ended";
                banner.innerText = "🛑 ELECTION STATUS: ENDED (Polls are Closed)";
                dot.className = "status-dot";
                dot.style.backgroundColor = "var(--error-color)";
                dot.style.boxShadow = "0 0 10px var(--error-color)";
                statusText.innerText = "LEDGER STATE: ENDED";

                if (inputField) inputField.placeholder = "Registers locked — Election ended";

                startBtn.style.display = "none";
                stopBtn.style.display = "block";
                stopBtn.disabled = true;
                stopBtn.innerText = "Polls Closed / Ended";
            } else { // "PREPARATION"
                banner.className = "status-banner prep";
                banner.innerText = "⏳ ELECTION STATUS: PREPARATION (Registering Candidates)";
                dot.className = "status-dot prep";
                dot.style.backgroundColor = "";
                dot.style.boxShadow = "";
                statusText.innerText = "LEDGER STATE: PREPARATION";

                if (inputField) inputField.placeholder = "e.g. Progressive Party";

                startBtn.style.display = "block";
                // Require at least 1 candidate to start election
                const canStart = (parties.length > 0);
                startBtn.disabled = !canStart;
                startBtn.innerText = canStart ? "Start Voting / Open Polls" : "Register a Candidate to Start";

                stopBtn.style.display = "none";
            }

            // Render Candidates Roster
            const roster = document.getElementById('candidates-roster');
            roster.innerHTML = '';
            if (parties.length === 0) {
                roster.innerHTML = '<div class="empty-state">No candidates registered yet. Please add a candidate.</div>';
            } else {
                parties.forEach(party => {
                    const tag = document.createElement('div');
                    tag.className = 'candidate-tag';
                    const initLetter = party.charAt(0);
                    tag.innerHTML = `
                        <div class="candidate-avatar">${initLetter}</div>
                        <span style="font-weight: 600;">${party}</span>
                    `;
                    roster.appendChild(tag);
                });
            }
        }

        async function submitRegister(event) {
            event.preventDefault();
            if (electionState !== "PREPARATION") return;

            const inputField = document.getElementById('new-party-name');
            const feedback = document.getElementById('register-feedback');
            feedback.style.display = 'none';
            feedback.className = 'feedback';

            const name = inputField.value.trim();
            if (!name) return;

            try {
                const res = await fetch('/parties', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ party: name })
                });
                const data = await res.json();

                if (res.ok) {
                    feedback.className = 'feedback success';
                    feedback.innerHTML = `✅ Successfully registered candidate: <strong>${name}</strong>`;
                    inputField.value = '';
                    refreshAdminState();
                } else {
                    feedback.className = 'feedback error';
                    feedback.innerHTML = `❌ Error: ${data.message || 'Registration failed'}`;
                }
            } catch (err) {
                feedback.className = 'feedback error';
                feedback.innerHTML = '❌ Server network error occurred. Please try again.';
            }
        }

        async function startVoting() {
            if (electionState !== "PREPARATION") return;
            if (!confirm("Are you sure you want to open the polls?\nWARNING: Candidate registrations will be locked permanently!")) {
                return;
            }

            try {
                const res = await fetch('/start_voting', { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    alert("Success! Polls are now open and candidate registrations are locked.");
                    refreshAdminState();
                } else {
                    alert(`Error starting election: ${data.message}`);
                }
            } catch (err) {
                alert("Server error when starting voting.");
            }
        }

        async function stopVoting() {
            if (electionState !== "LIVE") return;
            if (!confirm("Are you sure you want to close the polls?\nWARNING: No more votes can be cast!")) {
                return;
            }

            try {
                const res = await fetch('/stop_voting', { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    alert("Success! Polls are closed. Final results are now locked.");
                    refreshAdminState();
                } else {
                    alert(`Error stopping voting: ${data.message}`);
                }
            } catch (err) {
                alert("Server error when stopping voting.");
            }
        }

        async function resetElection() {
            if (!confirm("⚠️ WARNING: This will delete ALL registered candidates, clear ALL cast votes, and reset the blockchain! Are you absolutely sure?")) {
                return;
            }

            try {
                const res = await fetch('/reset_election', { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    alert("Success! Election reset and blockchain cleared.");
                    refreshAdminState();
                } else {
                    alert(`Error resetting election: ${data.message}`);
                }
            } catch (err) {
                alert("Server error when resetting election.");
            }
        }
    </script>
</body>

</html>
